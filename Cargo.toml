[package]
name = "rust_scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.3.1"
actix-cors = "0.6.4"

# Authentication
jsonwebtoken = "9.1.1"
bcrypt = "0.15.0"

# Database
mongodb = { version = "2.5.0", features = ["bson-chrono-0_4"] }
redis = { version = "0.23.0", features = ["tokio-comp", "connection-manager"] }

# Queue
lapin = "2.3.1"
tokio-amqp = "2.0.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Validation
validator = { version = "0.16", features = ["derive"] }
regex = "1.10.2"

# Async
tokio = { version = "1.28.2", features = ["full"] }
futures = "0.3"
futures-util = "0.3.28"
async-trait = "0.1.68"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3.3", features = ["v4", "serde"] }
env_logger = "0.10.0"
log = "0.4.20"
thiserror = "1.0.49"
anyhow = "1.0.75"
csv = "1.2"
derive_more = "0.99.17"
config = "0.13.3"
bson = { version = "2.6.1", features = ["chrono-0_4"] }

# Additional dependencies
dotenv = "0.15"
actix-rt = "2.9"
futures-lite = "2.1"

[dev-dependencies]
tokio-test = "0.4.3"
mockall = "0.11.4"
wiremock = "0.5.19"
