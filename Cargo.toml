[package]
name = "rust_scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.4"
actix-cors = "0.6"
actix-service = "2.0"
actix-web-httpauth = "0.8"
actix-rt = "2.9"

# Database
mongodb = { version = "2.8", features = ["tokio-runtime"] }
bson = { version = "2.8", features = ["chrono-0_4", "serde_with"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Message Queue
lapin = "2.3"  # Modern, async RabbitMQ client
tokio-amqp = "2.0"  # AMQP integration for tokio
futures-lite = "1.13"  # Lightweight futures and streams
futures-util = "0.3"  # Additional utilities for futures

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
log = { version = "0.4", features = ["std"] }

# Configuration
config = "0.13"
dotenv = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Utils
uuid = { version = "1.0", features = ["v4", "serde"] }

# Authentication
jsonwebtoken = "9.2"
bcrypt = "0.15"
lazy_static = "1.4"

# Validation
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"

# Additional dependencies
derive_more = "0.99"
env_logger = "0.10"

[dev-dependencies]
actix-rt = "2.9"
reqwest = { version = "0.11", features = ["json"] }
tokio-test = "0.4"
