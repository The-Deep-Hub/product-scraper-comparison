[package]
name = "rust_scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.4.0"
actix-cors = "0.6.4"
actix-service = "2.0.2"

# Authentication
jsonwebtoken = "9.1.1"
bcrypt = "0.15.0"
base64 = "0.21.5"

# Database
mongodb = { version = "2.7.1", features = ["tokio-runtime"] }
redis = { version = "0.23.3", features = ["tokio-comp", "connection-manager"] }

# Queue
lapin = "2.3.1"
tokio-amqp = "2.0.0"

# Serialization
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"

# Validation
validator = { version = "0.16", features = ["derive"] }
regex = "1.10.2"
url = "2.5.0"

# Async
tokio = { version = "1.34.0", features = ["full"] }
futures = "0.3.29"
futures-util = "0.3.28"
async-trait = "0.1.74"

# Utils
chrono = { version = "0.4.31", features = ["serde"] }
uuid = { version = "1.5.0", features = ["v4", "serde"] }
env_logger = "0.10.0"
log = "0.4.20"
thiserror = "1.0.50"
anyhow = "1.0"
csv = "1.2"
derive_more = "0.99.17"
config = "0.13.3"
bson = { version = "2.6.1", features = ["chrono-0_4"] }
lazy_static = "1.4.0"

# Scraping
reqwest = { version = "0.11.22", features = ["json", "cookies"] }
scraper = "0.17.1"
clap = { version = "4.4.11", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
urlencoding = "2.1.3"
dotenv = "0.15.0"
actix-rt = "2.9"
futures-lite = "2.1"

[dev-dependencies]
tokio-test = "0.4.3"
mockall = "0.12.1"
wiremock = "0.5.19"
