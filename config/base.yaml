environment: development

server:
  host: "0.0.0.0"  # Listen on all interfaces
  port: 8080

database:
  uri: "mongodb://rust_scraper:rust_scraper_password@localhost:27017/rust_scraper"
  database: "rust_scraper"  # Database name
  min_pool_size: 5
  max_pool_size: 10
  connection_timeout_ms: 5000

cache:
  host: "localhost"
  port: 6379
  user: "default"
  password: "redis_password123"  # Default password from .env
  default_ttl_secs: 3600
  connection_timeout_ms: 5000
  max_connections: 10
  auth_required: true  # Indicates that Redis requires authentication

queue:
  host: "localhost"
  port: 5672
  user: "guest"
  password: "guest"
  queue_name: "scraper_queue"
  prefetch_count: 10
  connection_timeout_ms: 5000
  retry_interval_ms: 1000
  max_retries: 3

http_client:
  base_url: "https://api.zyte.com/v1/extract"
  api_key: ""  # Will be overridden by environment variable
  request_timeout_ms: 30000
  max_concurrent_requests: 5
  max_retries: 3
  retry_delay_ms: 1000

stores:
  leroy:
    name: "Leroy Merlin"
    base_url: "https://www.leroymerlin.es"
    search_endpoint: "/search"
    api:
      api_type: "zyte"
      api_key: ""  # Will use the global Zyte API key
  
  bricodepot:
    name: "Bricodepot"
    base_url: "https://www.bricodepot.es"
    search_endpoint: "/productos/buscar"
    api:
      api_type: "zyte"
      api_key: ""  # Will use the global Zyte API key

  bauhaus:
    name: "Bauhaus"
    base_url: "https://www.bauhaus.es"
    search_endpoint: "/search"
    api:
      api_type: "zyte"
      api_key: ""  # Will use the global Zyte API key
