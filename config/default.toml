# Default configuration

# Server settings
host = "127.0.0.1"
port = 8080

# CORS settings
cors_allowed_origins = [
    "http://localhost:3000"
]

# Environment
environment = "development"

[api]
host = "127.0.0.1"
port = 8080

[auth]
jwt_secret = "your-secret-key-for-development"
token_expiration = 86400  # 24 hours in seconds

[mongodb]
uri = "mongodb://rust_scraper:rust_scraper_password@localhost:27017/rust_scraper"
database = "rust_scraper"
min_pool_size = 5
max_pool_size = 10
