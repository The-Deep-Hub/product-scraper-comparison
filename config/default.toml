# Default configuration for development environment
environment = "development"

[server]
host = "0.0.0.0"
port = 8080

[mongodb]
uri = "mongodb://localhost:27017"
database = "rust_scraper"
min_pool_size = 5
max_pool_size = 10

[redis]
host = "localhost"
port = 6379
user = "default"
password = ""

[rabbitmq]
amqp_addr = "amqp://guest:guest@localhost:5672"
prefetch_count = 1

[zyte]
api_key = ""
endpoint = "https://api.zyte.com/v1/extract"
concurrent_requests = 5
request_timeout = 30

[worker]
prefetch_count = 3
reconnect_delay_secs = 5
product_limit = 100

[worker.store_queues]
leroy = "leroy_tasks"
bauhaus = "bauhaus_tasks"
bricodepot = "bricodepot_tasks"
